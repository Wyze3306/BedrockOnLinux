# Flathub manifest for BedrockOnLinux.
#
# Two things make this more than a plain Python app:
#   1. The GUI is PySide6 (Qt for Python), which org.freedesktop.Platform does
#      not ship — a self-contained CPython + vendored PySide6-Essentials
#      wheel is bundled. Unlike the old Tkinter GUI this replaced, Qt's xcb
#      and wayland platform plugins are both bundled inside the wheel, so the
#      launcher can run under a native Wayland session directly rather than
#      needing an X11 fallback.
#   2. The game runs through umu-launcher → pressure-vessel, which builds its
#      container as a Flatpak sub-sandbox — hence --talk-name=org.freedesktop.Flatpak,
#      --allow=devel and --allow=multiarch (the Lutris/Bottles/Heroic recipe).
#
# Local test build: scripts/build-flatpak.sh (swaps the app source for the
# working tree); add --release to build this manifest as published.
app-id: io.github.wyze3306.BedrockOnLinux
# The GNOME runtime is used for one reason: it ships libwebkit2gtk-4.1, and
# org.freedesktop.Platform ships no WebKitGTK at all. Minecraft is downloaded
# from the Microsoft Store, xodus-cli opens that sign-in in a WebKitGTK
# webview, and no Flathub extension provides one — so on the freedesktop
# runtime the Flatpak could not install the game.
#
# It is a smaller change than it looks. GNOME's runtime is built on the same
# freedesktop base and declares the same org.freedesktop.Platform.GL extension
# point, so the GPU path is unchanged; and this manifest builds its own
# Python and vendors PySide6, so the launcher's interface never depended on
# the runtime.
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: bedrock-on-linux

# PySide6 installs several large shared libraries (the bundled Qt runtime)
# read-only. Disabling the optional post-build strip/debug split keeps the
# manifest buildable by an unprivileged flatpak-builder on native, encrypted,
# and FUSE-backed home filesystems.
build-options:
  strip: false
  no-debuginfo: true

finish-args:
  # GPU (Vulkan) + game controllers
  - --device=all
  # PySide6/Qt supports both platform plugins natively (xcb and wayland), so
  # unlike the previous Tkinter GUI this no longer strictly needs X11 for the
  # launcher window itself under a native Wayland session — but the game
  # (and winewayland is opt-in via BOL_INPUT=wayland) still commonly runs
  # through XWayland, so both sockets stay granted.
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=ipc
  # engine/game downloads, Microsoft sign-in, multiplayer
  - --share=network
  # Read-only access to the pre-XDG location for one-time migration. Using the
  # xdg-data alias here would shadow the private XDG destination read-only.
  - --filesystem=~/.local/share/bedrock-on-linux:ro
  # Discord Rich Presence: the client listens on a socket in the *host* runtime
  # directory, and the sandbox is given a runtime directory of its own, so
  # without these two paths a play session is simply never announced. One
  # socket each -- the host build and the Flatpak build of Discord -- and
  # nothing else; :create is deliberately absent, since it would put a
  # directory where Discord wants to make its socket. Flatpak binds them at
  # startup, so inside the sandbox Discord has to be running before the
  # launcher is (elsewhere the session picks it up whenever it appears).
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord/discord-ipc-0
  # No launcher code talks to the portal; the caller is the bundled Steam Linux
  # Runtime. pressure-vessel-wrap sees /.flatpak-info, switches from bubblewrap
  # to sub-sandbox mode, and its steam-runtime-launch-client then asks for the
  # container with org.freedesktop.Flatpak.Development.Spawn. Revoking the name
  # leaves the GUI, downloads and sign-in working and breaks only the game
  # launch, which is what makes the permission look unused (issue #157).
  # Check it with:
  #   flatpak run --command=gdbus io.github.wyze3306.BedrockOnLinux call \
  #     --session --dest org.freedesktop.Flatpak \
  #     --object-path /org/freedesktop/Flatpak/Development \
  #     --method org.freedesktop.DBus.Peer.Ping
  # That prints "()"; adding --no-talk-name=org.freedesktop.Flatpak before
  # --command turns it into ServiceUnknown, which is the failure users see.
  - --talk-name=org.freedesktop.Flatpak
  # Wine needs ptrace (devel) and 32-bit code (multiarch)
  - --allow=devel
  - --allow=multiarch

cleanup:
  - /include
  - /share/man
  - /share/doc
  - /lib/pkgconfig
  - '*.a'
  - '*.la'

modules:
  # Self-contained CPython so the launcher's `#!/usr/bin/env python3` resolves
  # to a known interpreter (/app/bin is first on PATH). No Tcl/Tk linking is
  # needed any more — the GUI toolkit is PySide6, vendored below as wheels.
  - name: python3
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --without-static-libpython
      - --with-ensurepip=no
    build-options:
      env:
        LDFLAGS: -Wl,-rpath,/app/lib
    post-install:
      - /app/bin/python3 -c "import sys; print(sys.version)"
    cleanup:
      - /lib/python3.12/test
      - /lib/python3.12/idlelib
      - /lib/python3.12/turtledemo
      - /lib/python3.12/tkinter
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.12.8/Python-3.12.8.tar.xz
        sha256: c909157bb25ec114e5869124cc2a9c4a4d4c1e957ca4ff553f1edc692101154e

  # cryptography (+ its cffi / pycparser deps) for the native Microsoft login:
  # it signs the Xbox Live device/request tokens, and without it sign-in fails
  # with a connection reset (0x80072746). The runtime ships none and the
  # bundled Python has no pip, so the wheels are vendored and unzipped straight
  # into site-packages. Bump all three (url + sha256) when cryptography moves;
  # the abi3 cryptography wheel stays valid across Python 3.x.
  - name: python3-cryptography
    buildsystem: simple
    build-commands:
      - install -d /app/lib/python3.12/site-packages
      - for w in *.whl; do python3 -m zipfile -e "$w" /app/lib/python3.12/site-packages/; done
      - /app/bin/python3 -c "import cryptography; print('cryptography', cryptography.__version__)"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/2c/99/2d13299eb3dd27b02dcfaafcc91d6b5cb3329f7cbd6d8f51921acd566c1a/cryptography-49.0.0-cp39-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: 35b151772baff2c74cba7fa290ceaff4c3b11c0c881eb93eb5dbc05a7cfbba18
      - type: file
        url: https://files.pythonhosted.org/packages/78/2d/7fa73dfa841b5ac06c7b8855cfc18622132e365f5b81d02230333ff26e9e/cffi-2.0.0-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: 3e17ed538242334bf70832644a32a7aae3d83b57567f9fd60a26257e992b79ba
      - type: file
        url: https://files.pythonhosted.org/packages/0c/c3/44f3fbbfa403ea2a7c779186dc20772604442dde72947e7d01069cbe98e3/pycparser-3.0-py3-none-any.whl
        sha256: b727414169a36b7d524c1c3e31839a521725078d7b2ff038656844266160a992

  # PySide6 (Qt for Python — the GUI toolkit) + its shiboken6 binding
  # generator dep. Vendored like cryptography (the runtime has no pip).
  # PySide6-Essentials only, not the PySide6 meta-package: the meta-package
  # also pulls PySide6-Addons (~167 MB of Qt modules — Multimedia, WebEngine,
  # Charts, … — this app never uses). Essentials alone already provides the
  # QtCore/QtGui/QtWidgets namespace under `PySide6.*`. Both wheels are
  # manylinux_2_28 (glibc 2.28+); bump both (url + sha256, in step with
  # third_party/requirements-appimage.txt and requirements-deb.txt) when the
  # version moves.
  - name: python3-pyside6
    buildsystem: simple
    build-commands:
      - for w in *.whl; do python3 -m zipfile -e "$w" /app/lib/python3.12/site-packages/; done
      - /app/bin/python3 -c "from PySide6.QtCore import __version__; print('PySide6', __version__)"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/be/82/c1c6932f9849bc5e75c93c38a29419505a6e3e0037261e28f3e7ecbf2751/shiboken6-6.9.3-cp39-abi3-manylinux_2_28_x86_64.whl
        sha256: f3f5337a3a8fc660ba1462265bd9a2bdda9588f8d90fbc3d5ac4ce3134c11e59
      - type: file
        url: https://files.pythonhosted.org/packages/85/e8/9396cf11a60f80175bb3c5c1d498d84e87b7af653ab4ea001acf821a3981/pyside6_essentials-6.9.3-cp39-abi3-manylinux_2_28_x86_64.whl
        sha256: c70d5544e892b201a677b615156fab6a0fef865e7fc287f55a0eae00a682e83f

  # packaging: pure-Python version-comparison helper the launcher's own
  # update/version-parsing code depends on. Vendored like cryptography (the
  # runtime has no pip); the wheel is py3-none-any, so it drops straight into
  # site-packages.
  - name: python3-packaging
    buildsystem: simple
    build-commands:
      - for w in *.whl; do python3 -m zipfile -e "$w" /app/lib/python3.12/site-packages/; done
      - /app/bin/python3 -c "import packaging; print('packaging', packaging.__version__)"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/df/b2/87e62e8c3e2f4b32e5fe99e0b86d576da1312593b39f47d8ceef365e95ed/packaging-26.2-py3-none-any.whl
        sha256: 5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e

  # python-xlib (+ its six dep): lets bol.x11 read monitor geometry straight
  # from the X server's RandR extension instead of parsing `xrandr` CLI text.
  # Optional (bol.x11 falls back to the xrandr CLI without it),
  # but vendored the same way since the runtime has no pip.
  - name: python3-xlib
    buildsystem: simple
    build-commands:
      - for w in *.whl; do python3 -m zipfile -e "$w" /app/lib/python3.12/site-packages/; done
      - /app/bin/python3 -c "import Xlib; print('python-xlib', Xlib.__version_string__)"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/fc/b8/ff33610932e0ee81ae7f1269c890f697d56ff74b9f5b2ee5d9b7fa2c5355/python_xlib-0.33-py2.py3-none-any.whl
        sha256: c3534038d42e0df2f1392a1b30a15a4ff5fdc2b86cfa94f072bf11b10a164398
      - type: file
        url: https://files.pythonhosted.org/packages/b7/ce/149a00dd41f10bc29e5921b496af8b574d8413afcd5e30dfa0ed46c2cc5e/six-1.17.0-py2.py3-none-any.whl
        sha256: 4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274

  # zstd CLI for the one .pkg.tar.zst (libcurl) the launcher extracts;
  # Python's tarfile can't read zstd and the runtime ships no unzstd.
  - name: zstd
    buildsystem: simple
    build-commands:
      - make -C programs zstd
      - install -Dm755 programs/zstd /app/bin/zstd
      - ln -sf zstd /app/bin/unzstd
    sources:
      - type: archive
        url: https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz
        sha256: 8c29e06cf42aacc1eafc4077ae2ec6c6fcb96a626157e0593d5e82a34fd403c1

  - name: bedrock-on-linux
    buildsystem: simple
    build-commands:
      - install -Dm755 bedrock-on-linux /app/bin/bedrock-on-linux
      # the implementation now lives in the bol/ package next to <prefix>/lib
      - mkdir -p /app/lib/bedrock-on-linux
      - cp -r bol /app/lib/bedrock-on-linux/bol
      - find /app/lib/bedrock-on-linux/bol -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - find /app/lib/bedrock-on-linux/bol -type f -name '*.pyc' -delete
      - install -Dm644 data/icon.png /app/share/icons/hicolor/256x256/apps/io.github.wyze3306.BedrockOnLinux.png
      - install -Dm644 LICENSE /app/share/licenses/bedrock-on-linux/LICENSE
      - install -Dm644 flatpak/io.github.wyze3306.BedrockOnLinux.desktop /app/share/applications/io.github.wyze3306.BedrockOnLinux.desktop
      - install -Dm644 flatpak/io.github.wyze3306.BedrockOnLinux.metainfo.xml /app/share/metainfo/io.github.wyze3306.BedrockOnLinux.metainfo.xml
    sources:
      # Pinned release. Bump tag+commit each release:
      #   git rev-parse vX.Y.Z^{commit}
      - type: git
        url: https://github.com/Wyze3306/BedrockOnLinux.git
        tag: v2.2.5
        commit: e926c72790fd347fee415fdf2d6d3322da846d88
