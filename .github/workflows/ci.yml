# Validate every pull request (and pushes to main) automatically: run the test
# suite and static checks so changes are verified before merge. Kept consistent
# with the rest of the pipeline: hosted runners, SHA-pinned actions, least
# privilege.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The GUI toolkit is PySide6 (Qt); the runner has no display, so any
      # test that constructs a QApplication needs the offscreen platform
      # plugin instead of trying to open a real X11/Wayland connection.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Qt runtime libraries
        # PySide6 links these at import time even under the offscreen
        # platform plugin — QT_QPA_PLATFORM=offscreen only changes which
        # windowing backend Qt talks to, it doesn't remove the shared-library
        # dependency on EGL/GL/X11 that QtGui pulls in.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxrender1 libxi6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
      - name: Run the test suite
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check \
            pytest 'cryptography==43.0.3' 'PySide6-Essentials==6.9.3'
          .venv/bin/python -m pytest -q
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Byte-compile the package
        run: python3 -m compileall -q bol
      - name: Shellcheck the scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning scripts/*.sh
      - name: Lint the workflows (actionlint)
        run: |
          ver=1.7.7
          sha=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sha}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: Lint Python (ruff, pyflakes rules)
        run: pipx run --spec 'ruff==0.14.3' ruff check --select F bol/ tests/
      - name: Audit the workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec 'zizmor==1.5.2' zizmor --persona=regular .github/workflows/
  cryptbase:
    # Wine runtime test for the from-source cryptbase RNG stub: proves
    # SystemFunction036 returns varied random bytes and does not recurse to a
    # stack overflow under Wine's advapi32->cryptbase RtlGenRandom forward.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Run scripts/test-cryptbase.sh in a pinned Trixie container
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            debian:trixie@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4 \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              bash scripts/pin-apt-snapshot.sh trixie
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                wine wine64 gcc-mingw-w64-x86-64
              scripts/test-cryptbase.sh
            '
  pins:
    # Guards against exactly the class of bug in #54's aftermath: bol/config.py
    # can commit a SHA-256 pin for a release asset that was never actually
    # published (or was published with different bytes) on WINEGDK_PREBUILT_REPO.
    # That leaves `main` referencing an engine/xcurl archive nothing can
    # download, which only surfaces later as a setup-time failure for users.
    # Catch it here, at PR/push time, instead.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Verify XODUS_REV names the patches the binary is built with
        run: |
          set -euo pipefail
          cfg=bol/config.py
          # third_party/xodus/patches/ is what BedrockOnLinux fixes in the
          # downloader itself, and scripts/build-xodus-cli.sh applies all of
          # them before compiling: a build with n patches is published as
          # <commit12>-p<n>, because a revision has to name exactly one set of
          # bytes. Nothing tied that back to the pin, so four patches -- the
          # package-cache race of #217 among them -- were written, tested and
          # merged while every user went on downloading the unpatched binary
          # and hitting the bug they fix (#241, #242). The pin is the only
          # thing that ships them.
          commit="$(grep -m1 '^XODUS_SOURCE_COMMIT = ' "$cfg" | cut -d'"' -f2)"
          rev="$(grep -m1 '^XODUS_REV = ' "$cfg" | cut -d'"' -f2)"
          level="$(find third_party/xodus/patches -maxdepth 1 -name '*.patch' | wc -l)"
          want="${commit:0:12}"
          [ "$level" -eq 0 ] || want="${want}-p${level}"
          echo "patches: ${level}"
          echo "pinned : ${rev}"
          echo "expects: ${want}"
          if [ "$rev" != "$want" ]; then
            echo "::error::XODUS_REV is '${rev}' but third_party/xodus/patches holds" \
                 "${level} patch(es), so scripts/build-xodus-cli.sh builds and" \
                 "publishes '${want}'. Adding or removing a patch means a new" \
                 "binary: run build-xodus.yml, pin the SHA-256 it prints as" \
                 "XODUS_ARCHIVE_SHA256, and set XODUS_REV to '${want}'." >&2
            exit 1
          fi
          echo "   ok — the pinned revision names the patch set on this branch."

      - name: Verify committed release pins resolve to a matching published asset
        env:
          XODUS_CANDIDATE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          cfg=bol/config.py
          repo="$(grep -m1 '^WINEGDK_PREBUILT_REPO = ' "$cfg" | cut -d'"' -f2)"

          check_pin() {
            local label="$1" tag="$2" asset_glob="$3" pin="$4"
            local asset_repo="${5:-$repo}"
            echo "== checking ${label} (tag: ${tag})"
            rm -rf /tmp/pin-check; mkdir -p /tmp/pin-check
            if ! gh release download "$tag" -R "$asset_repo" \
                -p "$asset_glob" -D /tmp/pin-check 2>/tmp/pin-check.err; then
              echo "::error::${label}: no release/asset matching '${asset_glob}' found on ${asset_repo} at tag '${tag}'." >&2
              cat /tmp/pin-check.err >&2
              return 1
            fi
            local f got
            f="$(find /tmp/pin-check -type f -name "$asset_glob" -print -quit)"
            if [ -z "$f" ]; then
              echo "::error::${label}: download succeeded but no file matched '${asset_glob}'." >&2
              return 1
            fi
            got="$(sha256sum "$f" | cut -d' ' -f1)"
            if [ "$got" != "$pin" ]; then
              echo "::error::${label}: published asset SHA-256 does not match the pin in ${cfg}." >&2
              echo "  pin      : ${pin}" >&2
              echo "  published: ${got}" >&2
              echo "  A stale/rebuilt pin usually means the matching build workflow" >&2
              echo "  (build-engine.yml, build-xcurl.yml or build-xodus.yml) was never run" >&2
              echo "  with publish:true against ${repo} after the pin changed." >&2
              return 1
            fi
            if [ "$asset_repo" != "$repo" ]; then
              gh attestation verify "$f" -R "$asset_repo" || return 1
            fi
            echo "   ok — ${label} pin matches the published asset."
          }

          fail=0

          eng_rev="$(grep -m1 '^WINEGDK_BUILD_REV = ' "$cfg" | cut -d'"' -f2)"
          eng_pin="$(grep -m1 '^WINEGDK_ARCHIVE_SHA256 = ' "$cfg" | cut -d'"' -f2)"
          check_pin "engine (WINEGDK_ARCHIVE_SHA256)" \
            "engine-${eng_rev}" "GDK-Proton-xuser-${eng_rev}.tar.gz" "$eng_pin" || fail=1

          xcurl_rev="$(grep -m1 '^OPENSSL_XCURL_REV = ' "$cfg" | cut -d'"' -f2)"
          xcurl_pin="$(grep -m1 '^OPENSSL_XCURL_ARCHIVE_SHA256 = ' "$cfg" | cut -d'"' -f2)"
          check_pin "OpenSSL-XCurl set (OPENSSL_XCURL_ARCHIVE_SHA256)" \
            "xcurl-${xcurl_rev}" "openssl-xcurl-set-${xcurl_rev}.tar.gz" "$xcurl_pin" || fail=1

          # xodus-cli is downloaded the first time someone installs the game, so
          # an unpublished pin here is not a setup-time failure but an
          # install-time one: the launcher signs in, then cannot fetch anything.
          xodus_rev="$(grep -m1 '^XODUS_REV = ' "$cfg" | cut -d'"' -f2)"
          xodus_pin="$(grep -m1 '^XODUS_ARCHIVE_SHA256 = ' "$cfg" | cut -d'"' -f2)"
          webview_rev="$(grep -m1 '^XODUS_WEBVIEW_REV = ' "$cfg" | cut -d'"' -f2)"
          webview_pin="$(grep -m1 '^XODUS_WEBVIEW_SHA256 = ' "$cfg" | cut -d'"' -f2)"
          xodus_repo="$repo"
          xodus_assets_ready() {
            local assets
            assets="$(gh release view "xodus-${xodus_rev}" -R "$repo" \
              --json assets --jq '.assets[].name' 2>/dev/null)" || return 1
            echo "$assets" | grep -Fxq "xodus-cli-${xodus_rev}.tar.gz" || return 1
            if [ -n "$webview_pin" ]; then
              echo "$assets" | grep -Fxq "xodus-webview-${webview_rev}.tar.xz" || return 1
            fi
          }
          # A main push starts publication in the release workflow in parallel.
          if [ -z "$XODUS_CANDIDATE_REPO" ]; then
            for attempt in {1..45}; do
              xodus_assets_ready && break
              [ "$attempt" -eq 45 ] && break
              echo "Waiting for automatic Xodus publication (${attempt}/45)."
              sleep 30
            done
          fi
          # A PR can pin its attested fork build before the merge publishes
          # the same bytes upstream. Packaging still requires upstream assets.
          if [ -n "$XODUS_CANDIDATE_REPO" ] && \
              ! gh release view "xodus-${xodus_rev}" -R "$repo" >/dev/null 2>&1; then
            xodus_repo="$XODUS_CANDIDATE_REPO"
          fi
          check_pin "xodus-cli (XODUS_ARCHIVE_SHA256)" \
            "xodus-${xodus_rev}" "xodus-cli-${xodus_rev}.tar.gz" "$xodus_pin" "$xodus_repo" || fail=1

          # The WebKitGTK runtime rides in the same release as the binary it
          # belongs to. An unset pin is a supported state -- the launcher then
          # asks for the host package instead of installing unverified bytes --
          # so only a set pin has to resolve.
          if [ -n "$webview_pin" ]; then
            check_pin "WebKitGTK runtime (XODUS_WEBVIEW_SHA256)" \
              "xodus-${xodus_rev}" "xodus-webview-${webview_rev}.tar.xz" \
              "$webview_pin" "$xodus_repo" || fail=1
          else
            echo "== skipping the WebKitGTK runtime: XODUS_WEBVIEW_SHA256 is unset"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more release pins in bol/config.py do not resolve to a matching published asset on ${repo}." >&2
            exit 1
          fi
