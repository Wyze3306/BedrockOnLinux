# Tier 1: build the universal vkd3d-proton DGC payload and publish it as an
# independently verifiable, attested artifact for the engine build to reuse.
#
# Source: HansKristian-Work/vkd3d-proton, built with the exact Debian 13
# (Trixie) mingw toolchain pinned in third_party/vkd3d-proton-universal/
# provenance.env. build-vkd3d-universal.sh verifies its four output DLLs against
# OUTPUT-SHA256SUMS, which is the byte-reproducibility gate.
#
# The compile runs inside a debian:trixie container via `docker run` while the
# JS actions (checkout, upload, attest) run on the host, avoiding the need for
# Node.js inside the minimal container.
#
# arch: aarch64 builds the experimental ARM64EC engine's payload instead
# (#250, third_party/vkd3d-proton-arm64x): the same source as ARM64X, on an ARM
# runner in Valve's steamrt4 arm64 SDK image. Until its OUTPUT-SHA256SUMS is
# committed a run prints the DLL hashes and uploads the artifact, and publishes
# nothing.

name: Build vkd3d-proton

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish + attest the payload as a release"
        type: boolean
        default: false
      arch:
        description: "x86_64, or aarch64 for the experimental ARM64EC engine"
        type: string
        default: x86_64
    outputs:
      artifact:
        description: "Name of the uploaded vkd3d artifact"
        value: ${{ jobs.build.outputs.artifact }}
      sha256:
        description: "SHA-256 of the packed vkd3d payload"
        value: ${{ jobs.build.outputs.sha256 }}
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish + attest the payload as a release on this fork"
        type: boolean
        default: true
      arch:
        description: "x86_64, or aarch64 for the experimental ARM64EC engine"
        type: choice
        options: [x86_64, aarch64]
        default: x86_64

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      ARCH: ${{ inputs.arch || 'x86_64' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build universal vkd3d-proton in a pinned Trixie container
        if: ${{ env.ARCH == 'x86_64' }}
        run: |
          mkdir -p "$RUNNER_TEMP/vkout"
          # The image is digest-pinned and apt is pinned to a snapshot.debian.org
          # date (scripts/pin-apt-snapshot.sh), so the toolchain is frozen and the
          # output stays reproducible across time; provenance.env records the
          # resulting versions. build-vkd3d-universal.sh's OUTPUT-SHA256SUMS check
          # is the fail-closed gate. A drift means re-baseline, not loosening it.
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/vkout:/out" \
            debian:trixie@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4 \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive LC_ALL=C LANG=C
              bash /src/scripts/pin-apt-snapshot.sh trixie
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates git python3 python3-pip \
                binutils diffutils file gawk \
                meson glslang-tools spirv-tools \
                gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 \
                g++-mingw-w64-x86-64 g++-mingw-w64-i686 \
                binutils-mingw-w64 mingw-w64-tools
              pip3 install --break-system-packages "ninja==1.13.0"
              # provenance.env records the win32 gcc variant; select it.
              for t in gcc g++; do for a in x86_64 i686; do
                update-alternatives --set "${a}-w64-mingw32-${t}" \
                  "/usr/bin/${a}-w64-mingw32-${t}-win32" || true
              done; done
              # Match the environment the vendored restore-nv-dgc.patch was
              # generated in: relax the whitespace check (the NV-DGC revert
              # restores vendored source whose exact upstream whitespace the
              # repo tolerates via .gitattributes) and pin the diff index-line
              # blob-hash abbreviation to 7 chars (git auto-scales it by object
              # count; a fresh full-submodule clone would otherwise emit 8).
              # The byte-for-byte cmp against restore-nv-dgc.patch still guards it.
              git config --global core.whitespace "-blank-at-eof,-blank-at-eol,-space-before-tab"
              git config --global core.abbrev 7
              /src/scripts/build-vkd3d-universal.sh /out
            '
          # docker writes as root; hand the tree back to the runner user.
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/vkout"

      - name: Build vkd3d-proton as ARM64X in the steamrt4 arm64 SDK container
        if: ${{ env.ARCH == 'aarch64' }}
        run: |
          mkdir -p "$RUNNER_TEMP/vkout"
          image="$(grep -m1 '^VKD3D_ARM64X_SDK_IMAGE=' third_party/vkd3d-proton-arm64x/provenance.env | cut -d"'" -f2)"
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/vkout:/out" \
            "$image" \
            bash -euo pipefail -c '
              # The same git settings the x86 recipe needs to regenerate the
              # vendored NV-DGC revert byte for byte.
              git config --global core.whitespace "-blank-at-eof,-blank-at-eol,-space-before-tab"
              git config --global core.abbrev 7
              git config --global --add safe.directory "*"
              /src/scripts/build-vkd3d-arm64x.sh /out
            '
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/vkout"

      - name: Name the release after the output hash lock
        run: |
          # A rebuilt payload gets a release of its own rather than replacing
          # the bytes earlier engine revisions were assembled from.
          # The file store names the payload after the same lock
          # (STORE_ASSET); VKD3D_TAG is the release it had before the store.
          if [ "$ARCH" = aarch64 ]; then
            if tag="$(scripts/vkd3d-release-tag.sh aarch64)"; then
              {
                echo "VKD3D_TAG=$tag"
                echo "STORE_ASSET=$(scripts/vkd3d-release-tag.sh --asset aarch64)"
                echo "PUBLISHABLE=true"
              } >> "$GITHUB_ENV"
            else
              echo "::warning::ARM64X OUTPUT-SHA256SUMS is not committed: pin the hashes above and run again to publish."
              echo "PUBLISHABLE=false" >> "$GITHUB_ENV"
            fi
          else
            {
              echo "VKD3D_TAG=$(scripts/vkd3d-release-tag.sh)"
              echo "STORE_ASSET=$(scripts/vkd3d-release-tag.sh --asset)"
              echo "PUBLISHABLE=true"
            } >> "$GITHUB_ENV"
          fi

      - name: Pack the vkd3d output deterministically
        id: pack
        run: |
          out="vkd3d-universal-3.0.1-nv-dgc.tar.gz"
          artifact=vkd3d-universal
          if [ "$ARCH" = aarch64 ]; then
            out="vkd3d-arm64x-3.0.1-nv-dgc.tar.gz"
            artifact=vkd3d-arm64x
          fi
          tar --sort=name --format=gnu --hard-dereference \
            --mtime=@1784308597 --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP/vkout/vkd3d-build-output" -cf - vkd3d-proton-3.0.1-nv-dgc \
            | gzip -n -6 > "$out"
          sha="$(sha256sum "$out" | cut -d' ' -f1)"
          echo "$sha  $out" > "$out.sha256"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "TARBALL=$out" >> "$GITHUB_ENV"
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
          echo "built vkd3d payload: $out  sha256=$sha"

      - name: Upload vkd3d artifact (reuse within a run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Keep a published payload's bytes
        if: ${{ inputs.publish && env.PUBLISHABLE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          # The x86-64 payload is named after the DLL lock only, and the
          # tarball around those DLLs is not byte-reproducible (it carries the
          # meson build dirs). Publishing it again would swap the bytes the
          # published engines were assembled and attested from, so a payload
          # already published -- in the file store, or in the release of its
          # own it had before the store -- is kept as it is. Its DLLs match
          # this build's: the build script gated them on OUTPUT-SHA256SUMS,
          # whose hash names it. A release.yml force_rebuild lands here too,
          # so this skips rather than fails.
          published="$(scripts/release-files.sh asset-sha "$STORE_ASSET")"
          where="$STORE_ASSET"
          if [ -z "$published" ]; then
            if ! err="$(gh release view "$VKD3D_TAG" -R "$GITHUB_REPOSITORY" 2>&1 >/dev/null)"; then
              case "$err" in
                *"release not found"*)
                  echo "PUBLISH_VKD3D=true" >> "$GITHUB_ENV"
                  exit 0 ;;
              esac
              echo "::error::cannot tell whether $VKD3D_TAG is published: $err" >&2
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/published"
            gh release download "$VKD3D_TAG" -R "$GITHUB_REPOSITORY" \
              -p "$TARBALL.sha256" -D "$RUNNER_TEMP/published"
            published="$(cut -d' ' -f1 "$RUNNER_TEMP/published/$TARBALL.sha256")"
            where="$VKD3D_TAG"
          fi
          if [ "$published" = "$BUILT_SHA256" ]; then
            echo "$where already holds these bytes ($published)."
          elif [ "$ARCH" = aarch64 ]; then
            # The ARM64X payload is byte-reproducible (its pin is the
            # tarball itself), so different bytes are a broken build.
            echo "::error::$where already holds $published" >&2
            exit 1
          else
            echo "::warning::$where already holds $published; this build packed $BUILT_SHA256. Keeping the published payload (same DLLs, see OUTPUT-SHA256SUMS); this run's tarball stays a workflow artifact only."
          fi
          echo "PUBLISH_VKD3D=false" >> "$GITHUB_ENV"

      - name: Name the payload after its lock for the file store
        if: ${{ inputs.publish && env.PUBLISHABLE == 'true' && env.PUBLISH_VKD3D == 'true' }}
        run: |
          cp "$TARBALL" "$STORE_ASSET"
          sha256sum "$STORE_ASSET" > "$STORE_ASSET.sha256"

      - name: Attest build provenance
        if: ${{ inputs.publish && env.PUBLISHABLE == 'true' && env.PUBLISH_VKD3D == 'true' }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.STORE_ASSET }}

      # Reproducible universal vkd3d-proton (EXT + restored NV DGC) build.
      - name: Publish the vkd3d payload to the launcher's file store
        if: ${{ inputs.publish && env.PUBLISHABLE == 'true' && env.PUBLISH_VKD3D == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-files.sh publish "$STORE_ASSET"
