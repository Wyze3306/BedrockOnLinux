# Tier 2 (orchestrator): assemble the managed engine (GDK-Proton-xuser) from the
# WineGDK prefix + universal vkd3d payload + GDK-Proton base, assert it
# reproduces the SHA-256 pinned in bol/config.py, and publish + attest it.
#
# By default it REUSES the published, attested WineGDK prefix and vkd3d payload
# (built by build-winegdk.yml / build-vkd3d.yml), verifying each one's
# provenance attestation and SHA-256 before use. They are taken from the
# launcher's file store (scripts/release-files.sh), or from the release of
# their own they had before it. Set rebuild_from_source to compile both
# from source in the same run instead, for a fully-from-source traceable build.
#
# Bootstrap: on a fresh fork, first run "Build WineGDK" and "Build vkd3d-proton"
# (publish: true) once to publish them, or run this workflow with
# rebuild_from_source: true.
#
# Public verification of any published artifact:
#   gh attestation verify <file> --repo <owner>/BedrockOnLinux
#
# arch: aarch64 assembles the experimental ARM64EC engine instead (#250,
# docs/ARM64EC.md, scripts/package-engine-arm64.sh) on an ARM runner, from the
# published aarch64 WineGDK prefix, the ARM64X and x86 vkd3d payloads, the
# GE-Proton11-14-aarch64 base and GDK-Proton10-32's x64 libraries. It is pinned
# apart (WINEGDK_ARM64_*): while WINEGDK_ARM64_ARCHIVE_SHA256 is empty a run
# prints the archive's SHA-256, runs the smoke tests and publishes nothing.

name: Build managed engine

on:
  workflow_call:
    inputs:
      rebuild_from_source:
        description: "Rebuild WineGDK + vkd3d from source instead of reusing published releases"
        type: boolean
        default: false
      publish:
        description: "Publish + attest the built engine as a release on this fork"
        type: boolean
        default: false
      arch:
        description: "x86_64, or aarch64 for the experimental ARM64EC engine"
        type: string
        default: x86_64
  workflow_dispatch:
    inputs:
      rebuild_from_source:
        description: "Rebuild WineGDK + vkd3d from source instead of reusing published releases"
        type: boolean
        default: false
      publish:
        description: "Publish + attest the built engine as a release on this fork"
        type: boolean
        default: false
      arch:
        description: "x86_64, or aarch64 for the experimental ARM64EC engine"
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
  push:
    tags:
      - "engine-*"

permissions:
  contents: read

jobs:
  # Optional from-source rebuilds. Skipped unless rebuild_from_source is set;
  # they publish nothing (publish: false) and only hand their artifacts to the
  # package job within this run. They inherit the top-level contents: read.
  winegdk:
    if: ${{ inputs.rebuild_from_source && inputs.arch != 'aarch64' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-winegdk.yml
    with:
      publish: false

  vkd3d:
    if: ${{ inputs.rebuild_from_source && inputs.arch != 'aarch64' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-vkd3d.yml
    with:
      publish: false

  package:
    needs: [winegdk, vkd3d]
    # Run whether or not the rebuild jobs were skipped, but not if they failed.
    # Never for the ARM64EC engine, whose tags would otherwise match engine-*.
    if: ${{ !failure() && !cancelled() && inputs.arch != 'aarch64' && !startsWith(github.ref_name, 'engine-arm64ec-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils python3

      # ---- WineGDK prefix: rebuilt artifact, or verified released one ----
      - name: Download rebuilt WineGDK artifact
        if: ${{ inputs.rebuild_from_source }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: winegdk-prefix
          path: ${{ runner.temp }}/wg-dl

      - name: Download + verify released WineGDK
        if: ${{ !inputs.rebuild_from_source }}
        run: |
          mkdir -p "${{ runner.temp }}/wg-dl"
          tag="$(scripts/winegdk-release-tag.sh)"
          prefix_archive="winegdk-prefix-${tag#winegdk-}.tar.gz"
          scripts/release-files.sh fetch "$prefix_archive" "${{ runner.temp }}/wg-dl" "$tag"
          gh attestation verify "${{ runner.temp }}/wg-dl/${prefix_archive}" \
            -R "${{ github.repository }}"
          (cd "${{ runner.temp }}/wg-dl" && sha256sum -c "${prefix_archive}.sha256")
          # Also fail closed unless the reused prefix matches the committed pin,
          # not just its own published sidecar.
          pin="$(grep -m1 '^WINEGDK_PREFIX_SHA256 = ' bol/config.py | cut -d'"' -f2)"
          echo "${pin}  ${{ runner.temp }}/wg-dl/${prefix_archive}" | sha256sum -c -

      - name: Unpack WineGDK prefix
        run: |
          mkdir -p "${{ runner.temp }}/wg"
          tar -C "${{ runner.temp }}/wg" -xzf "${{ runner.temp }}"/wg-dl/winegdk-prefix-*.tar.gz

      # ---- vkd3d payload: rebuilt artifact, or verified released one ----
      - name: Download rebuilt vkd3d artifact
        if: ${{ inputs.rebuild_from_source }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vkd3d-universal
          path: ${{ runner.temp }}/vk-dl

      - name: Download + verify released vkd3d
        if: ${{ !inputs.rebuild_from_source }}
        run: |
          mkdir -p "${{ runner.temp }}/vk-dl"
          tag="$(scripts/vkd3d-release-tag.sh)"
          asset="$(scripts/vkd3d-release-tag.sh --asset)"
          scripts/release-files.sh fetch "$asset" "${{ runner.temp }}/vk-dl" \
            "$tag" vkd3d-universal-3.0.1-nv-dgc.tar.gz
          gh attestation verify "${{ runner.temp }}/vk-dl/$asset" \
            -R "${{ github.repository }}"
          (cd "${{ runner.temp }}/vk-dl" && sha256sum -c "$asset.sha256")

      - name: Unpack + verify vkd3d against the committed DLL hashes
        run: |
          mkdir -p "${{ runner.temp }}/vk"
          tar -C "${{ runner.temp }}/vk" -xzf "${{ runner.temp }}"/vk-dl/vkd3d-universal-*.tar.gz
          # vkd3d is reused by tag (its tarball wrapper is not itself a committed
          # pin), so verify the DLLs against the reproducible OUTPUT-SHA256SUMS
          # here: fail fast and clearly on drift instead of only later, and
          # transitively, via the engine archive assert.
          ( cd "${{ runner.temp }}/vk/vkd3d-proton-3.0.1-nv-dgc" \
            && sha256sum -c "$GITHUB_WORKSPACE/third_party/vkd3d-proton-universal/OUTPUT-SHA256SUMS" )

      # ---- GDK-Proton base (extracted tree = ENGINE_DIR) ----
      - name: Fetch + extract the GDK-Proton base
        run: |
          mkdir -p "${{ runner.temp }}/base" "${{ runner.temp }}/engine"
          gh release download release10-32 -R Weather-OS/GDK-Proton \
            -p GDK-Proton10-32.tar.gz -D "${{ runner.temp }}/base"
          # Pin the public base by SHA-256 (the release10-32 asset digest) so a
          # changed base fails here, not only transitively via the engine assert.
          echo "1e80f4e714f877f42101d5775bd38ca0a15a38d304e24af1f15c6deec4ebac2d  ${{ runner.temp }}/base/GDK-Proton10-32.tar.gz" \
            | sha256sum -c -
          tar -C "${{ runner.temp }}/engine" -xzf "${{ runner.temp }}/base/GDK-Proton10-32.tar.gz"

      - name: Swap in DXVK v3.0.1 (the public base ships 2.7.1; upstream used 3.0.1)
        run: |
          bash scripts/apply-dxvk-301.sh "${{ runner.temp }}/engine/GDK-Proton10-32"

      - name: Package the engine
        run: |
          commit="$(grep -m1 '^WINEGDK_SOURCE_COMMIT = ' bol/config.py | cut -d'"' -f2)"
          scripts/package-engine.sh \
            "${{ runner.temp }}/engine/GDK-Proton10-32" \
            "${{ runner.temp }}/vk/vkd3d-proton-3.0.1-nv-dgc" \
            "$commit" \
            "${{ runner.temp }}/base/GDK-Proton10-32.tar.gz" \
            "${{ runner.temp }}/wg/prefix"

      - name: Assert the archive reproduces the pinned SHA-256
        run: |
          rev="$(grep -m1 '^WINEGDK_BUILD_REV = ' bol/config.py | cut -d'"' -f2)"
          pin="$(grep -m1 '^WINEGDK_ARCHIVE_SHA256 = ' bol/config.py | cut -d'"' -f2)"
          built="$(sha256sum "dist/GDK-Proton-xuser-${rev}.tar.gz" | cut -d' ' -f1)"
          echo "pinned : $pin"
          echo "built  : $built"
          if [ "$built" != "$pin" ]; then
            echo "::error::built engine SHA-256 does not match the config pin;" \
                 "the build did not reproduce the reviewed bytes." >&2
            exit 1
          fi
          echo "REV=$rev" >> "$GITHUB_ENV"

      - name: Smoke test - the engine loads inside the sniper runtime
        run: |
          # The assert above proves the bytes are the reproducible ones; this
          # proves they RUN. Wine's ntdll must dlopen inside the pressure-vessel/
          # sniper runtime, which ships no system libunwind, so this catches a
          # reproducible-but-unrunnable engine that the hash + manifest checks
          # cannot. Proton puts files/lib/x86_64-linux-gnu on LD_LIBRARY_PATH.
          mkdir -p "${{ runner.temp }}/smoke"
          tar -C "${{ runner.temp }}/smoke" -xzf "dist/GDK-Proton-xuser-${{ env.REV }}.tar.gz"
          eng="${{ runner.temp }}/smoke/GDK-Proton-xuser"
          sniper='registry.gitlab.steamos.cloud/steamrt/sniper/platform@sha256:ab8bb63cd74743bfd7fbc2116c77055a077a59004b6f91455f6243ef931f95b1'
          # Pull first so docker's "Pulling…/Downloaded" progress does not land in
          # the captured wine output.
          docker pull -q "$sniper" >/dev/null
          out="$(docker run --rm -v "$eng:/engine:ro" "$sniper" \
            bash -c 'LD_LIBRARY_PATH=/engine/files/lib/x86_64-linux-gnu /engine/files/bin/wine --version' 2>&1)"
          echo "sniper output: $out"
          if printf '%s\n' "$out" | grep -qE '^wine-[0-9]'; then
            echo "engine loads in sniper"
          else
            echo "::error::engine failed to load inside the sniper runtime: $out" >&2
            exit 1
          fi

      - name: Attest engine provenance
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/GDK-Proton-xuser-${{ env.REV }}.tar.gz

      # Reproducible engine build of GDK-Proton-xuser, verified above to match
      # the SHA-256 pinned in bol/config.py. Published before the file store
      # existed, an engine had a release of its own, engine-<rev>; the store
      # refuses other bytes under a name it holds, and the pin assert above
      # refuses other bytes than that release's.
      - name: Publish the engine to the launcher's file store
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: scripts/release-files.sh publish "dist/GDK-Proton-xuser-$REV.tar.gz"

  package-arm64:
    if: ${{ inputs.arch == 'aarch64' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      SDK_IMAGE: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/arm64-llvm@sha256:3a8199ffdd54c51f47e1b0d059e6fe583745214043f1f8c2e2e18377e72a3776
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Make room on the ARM runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo mkdir -p /mnt/arm && sudo chown "$(id -u):$(id -g)" /mnt/arm
          df -h / /mnt

      - name: Download + verify the aarch64 WineGDK prefix
        run: |
          tag="$(scripts/winegdk-release-tag.sh)-aarch64"
          asset="winegdk-prefix-${tag#winegdk-}.tar.gz"
          mkdir -p /mnt/arm/wg-dl /mnt/arm/wg
          scripts/release-files.sh fetch "$asset" /mnt/arm/wg-dl "$tag"
          gh attestation verify "/mnt/arm/wg-dl/$asset" -R "$GITHUB_REPOSITORY"
          pin="$(grep -m1 '^WINEGDK_ARM64_PREFIX_SHA256 = ' bol/config.py | cut -d'"' -f2)"
          echo "${pin}  /mnt/arm/wg-dl/$asset" | sha256sum -c -
          tar -C /mnt/arm/wg -xzf "/mnt/arm/wg-dl/$asset"
          rm -rf /mnt/arm/wg-dl

      - name: Download + verify both vkd3d payloads
        run: |
          mkdir -p /mnt/arm/vk-dl /mnt/arm/vk-arm /mnt/arm/vk-x86
          tag="$(scripts/vkd3d-release-tag.sh aarch64)"
          asset="$(scripts/vkd3d-release-tag.sh --asset aarch64)"
          scripts/release-files.sh fetch "$asset" /mnt/arm/vk-dl "$tag" vkd3d-arm64x-3.0.1-nv-dgc.tar.gz
          gh attestation verify "/mnt/arm/vk-dl/$asset" -R "$GITHUB_REPOSITORY"
          tar -C /mnt/arm/vk-arm -xzf "/mnt/arm/vk-dl/$asset"
          tag="$(scripts/vkd3d-release-tag.sh)"
          asset="$(scripts/vkd3d-release-tag.sh --asset)"
          scripts/release-files.sh fetch "$asset" /mnt/arm/vk-dl "$tag" vkd3d-universal-3.0.1-nv-dgc.tar.gz
          gh attestation verify "/mnt/arm/vk-dl/$asset" -R "$GITHUB_REPOSITORY"
          tar -C /mnt/arm/vk-x86 -xzf "/mnt/arm/vk-dl/$asset"
          rm -rf /mnt/arm/vk-dl

      - name: Fetch the GE-Proton11-14-aarch64 and GDK-Proton10-32 bases
        run: |
          mkdir -p /mnt/arm/base
          gh release download GE-Proton11-14 -R GloriousEggroll/proton-ge-custom \
            -p GE-Proton11-14-aarch64.tar.gz -D /mnt/arm/base
          gh release download release10-32 -R Weather-OS/GDK-Proton \
            -p GDK-Proton10-32.tar.gz -D /mnt/arm/base
          # package-engine-arm64.sh checks both against their pinned SHA-256.

      - name: Package the ARM64EC engine
        run: |
          scripts/package-engine-arm64.sh \
            /mnt/arm/base/GE-Proton11-14-aarch64.tar.gz \
            /mnt/arm/base/GDK-Proton10-32.tar.gz \
            /mnt/arm/wg/prefix \
            /mnt/arm/vk-arm/vkd3d-proton-3.0.1-nv-dgc \
            /mnt/arm/vk-x86/vkd3d-proton-3.0.1-nv-dgc \
            dist
          rm -rf /mnt/arm/base /mnt/arm/wg /mnt/arm/vk-arm /mnt/arm/vk-x86
          df -h / /mnt

      - name: Compare the archive with its pin
        id: pin
        run: |
          rev="$(grep -m1 '^WINEGDK_ARM64_BUILD_REV = ' bol/config.py | cut -d'"' -f2)"
          pin="$(grep -m1 '^WINEGDK_ARM64_ARCHIVE_SHA256 = ' bol/config.py | cut -d'"' -f2)"
          built="$(sha256sum "dist/GDK-Proton-xuser-${rev}.tar.gz" | cut -d' ' -f1)"
          echo "pinned : ${pin:-<unset>}"
          echo "built  : $built"
          publishable=true
          if [ -z "$pin" ]; then
            echo "::warning::WINEGDK_ARM64_ARCHIVE_SHA256 is empty: pin $built and run again to publish."
            publishable=false
          elif [ "$built" != "$pin" ]; then
            echo "::error::built ARM64EC engine SHA-256 does not match WINEGDK_ARM64_ARCHIVE_SHA256." >&2
            exit 1
          fi
          echo "REV=$rev" >> "$GITHUB_ENV"
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"

      - name: Smoke test - Wine, FEX and the GDK runtime in Steam Runtime 4
        run: |
          mkdir -p /mnt/arm/smoke
          tar -C /mnt/arm/smoke -xzf "dist/GDK-Proton-xuser-${REV}.tar.gz"
          docker pull -q "$SDK_IMAGE" >/dev/null
          docker run --rm -v /mnt/arm/smoke/GDK-Proton-xuser-arm64:/engine:ro \
            -v "$PWD/scripts/arm64ec-smoke:/smoke:ro" "$SDK_IMAGE" \
            bash /smoke/run.sh /engine

      - name: Attest engine provenance
        if: ${{ inputs.publish && steps.pin.outputs.publishable == 'true' }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/GDK-Proton-xuser-${{ env.REV }}.tar.gz

      - name: Refuse to replace a published ARM64EC engine
        if: ${{ inputs.publish && steps.pin.outputs.publishable == 'true' }}
        run: |
          # Published before the file store existed, an engine had a release
          # of its own; the store refuses other bytes under a name it holds.
          if gh release view "engine-$REV" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::engine-$REV is already published; name a new WINEGDK_ARM64_BUILD_REV." >&2
            exit 1
          fi

      # Experimental engine for aarch64 hosts (#250): WineGDK built as ARM64EC
      # on GE-Proton11-14-aarch64, with FEX translating only the x64 game.
      - name: Publish the ARM64EC engine to the launcher's file store
        if: ${{ inputs.publish && steps.pin.outputs.publishable == 'true' }}
        run: scripts/release-files.sh publish "dist/GDK-Proton-xuser-$REV.tar.gz"
