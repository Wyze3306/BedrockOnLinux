# Tier 1: build xodus-cli from the pinned upstream commit and publish it as an
# attested artifact the launcher downloads at runtime.
#
# Xodus (https://github.com/xodus-gaming/xodus, GPL-3.0) is how the launcher
# acquires Minecraft: it signs in to the user's own Microsoft account, obtains
# the title license and streams the MSIXVC package from the official Xbox CDN.
# See third_party/xodus/README.md for what the launcher calls and why the
# key-chain-file feature is mandatory.
#
# The compile runs in a debian:trixie container via `docker run` so the JS
# actions (checkout, attest, publish) keep Node.js on the host, matching
# build-xcurl.yml. The source tarball is published beside the binary so the
# GPL-3.0 source requirement is met by the same release.
#
# arch: aarch64 builds the same rev natively on an ARM runner for the
# experimental ARM64EC engine (#250): xodus-cli-<rev>-aarch64.tar.gz and
# xodus-webview-<rev>-aarch64.tar.xz, released under xodus-<rev>-aarch64 and
# pinned by XODUS_ARM64_ARCHIVE_SHA256 / XODUS_WEBVIEW_ARM64_SHA256. While either
# pin is empty a run prints the SHA-256s and publishes nothing.

name: Build xodus-cli

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish + attest xodus-cli as a release"
        type: boolean
        default: false
      arch:
        description: "x86_64, or aarch64 for the experimental ARM64EC engine"
        type: string
        default: x86_64
    outputs:
      artifact:
        description: "Name of the uploaded xodus-cli artifact"
        value: xodus-cli
      sha256:
        description: "SHA-256 of the built xodus-cli archive"
        value: ${{ jobs.build.outputs.sha256 }}
      webview_sha256:
        description: "SHA-256 of the built WebKitGTK runtime archive"
        value: ${{ jobs.build.outputs.webview_sha256 }}
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish + attest xodus-cli as a release on this fork"
        type: boolean
        default: true
      arch:
        description: "x86_64, or aarch64 for the experimental ARM64EC engine"
        type: choice
        options: [x86_64, aarch64]
        default: x86_64

permissions:
  contents: read

env:
  # Pinned so the artifact has a stable SHA-256 to pin in bol/config.py. Bump
  # deliberately; a toolchain change reshuffles the binary. This is the version
  # the branch was validated against locally, and the floor is real: the xodus
  # workspace declares rust-version 1.98.0 since xodus-gaming/xodus@f4ca223,
  # and cargo refuses to build it with anything older.
  RUST_TOOLCHAIN: "1.98.1"
  # The linker behind the glibc floor (scripts/build-xodus-cli.sh): zig
  # supplies the C library xodus-cli is linked against, at the version the
  # target names, and cargo-zigbuild drives it. Both are pinned for the same
  # reason as the toolchain, the zig archive by the SHA-256 ziglang.org lists
  # for it.
  ZIG_VERSION: "0.15.2"
  ZIG_SHA256: "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239"
  ZIG_SHA256_AARCH64: "958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f"
  CARGO_ZIGBUILD_VERSION: "0.24.1"

jobs:
  build:
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      rev: ${{ steps.build.outputs.rev }}
      webview_sha256: ${{ steps.webview.outputs.sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build xodus-cli in a pinned Trixie container
        run: |
          # The image digest names a multi-platform index: the ARM runner
          # gets the arm64 image of the same release.
          arch="$(uname -m)"
          zig_sha="$ZIG_SHA256"
          [ "$arch" = x86_64 ] || zig_sha="$ZIG_SHA256_AARCH64"
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e RUST_TOOLCHAIN="${RUST_TOOLCHAIN}" -e ARCH="$arch" \
            -e ZIG_VERSION="${ZIG_VERSION}" -e ZIG_SHA256="$zig_sha" \
            -e CARGO_ZIGBUILD_VERSION="${CARGO_ZIGBUILD_VERSION}" \
            debian:trixie@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4 \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              bash scripts/pin-apt-snapshot.sh trixie
              # Let the snapshot outrank what the image already carries. The
              # image ships packages newer than 20260701, and
              # libwebkit2gtk-4.1-dev reaches liblzma-dev, which requires
              # liblzma5 at exactly the snapshot version -- so without this the
              # install cannot be resolved at all. A priority above 1000 is the
              # only setting that makes apt pick an older version: both
              # --allow-downgrades and dist-upgrade merely permit a downgrade,
              # neither asks for one. It stays local to this workflow because
              # the snapshot script is shared with the engine builds, whose
              # archive SHA-256 is pinned against what it produces today.
              printf "Package: *\nPin: origin snapshot.debian.org\nPin-Priority: 1001\n" \
                > /etc/apt/preferences.d/99-pinned-snapshot
              apt-get update
              # protoc: the xodus crate runs prost-build.
              # cmake: libz-ng-sys builds zlib-ng with it, for the flate2
              #   backend xodus reads compressed package data through.
              # libwebkit2gtk-4.1-dev: wry/tao, linked unconditionally for the
              #   login webview.
              # libssl-dev: openssl-sys, pulled in through
              #   dbus-secret-service-keyring-store even under key-chain-file.
              # glib-networking: the GIO TLS backend. Only a Recommends of
              #   libsoup3, so --no-install-recommends leaves it out, and the
              #   webview bundle would then be unable to load an https page.
              # patchelf, xz-utils: build-xodus-webview.sh makes every bundled
              #   object find the rest of the bundle relative to itself.
              # No apostrophes anywhere in this script: it is a single quoted
              # argument to docker run, and one would end it here and hand the
              # rest to the host shell.
              apt-get install -y --no-install-recommends --allow-downgrades \
                build-essential pkg-config git ca-certificates curl \
                cmake protobuf-compiler libwebkit2gtk-4.1-dev libssl-dev \
                glib-networking patchelf xz-utils \
                tar gzip coreutils
              curl -fsSL --retry 5 https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
              . "$HOME/.cargo/env"
              zig_archive="zig-${ARCH}-linux-${ZIG_VERSION}.tar.xz"
              curl -fsSL --retry 5 -o "/tmp/${zig_archive}" \
                "https://ziglang.org/download/${ZIG_VERSION}/${zig_archive}"
              echo "${ZIG_SHA256}  /tmp/${zig_archive}" | sha256sum -c -
              mkdir -p /opt/zig
              tar -xJf "/tmp/${zig_archive}" -C /opt/zig --strip-components=1
              export PATH="/opt/zig:$PATH"
              cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
              scripts/build-xodus-cli.sh /tmp/xodus-work
              # The WebKitGTK runtime comes from a later snapshot than the
              # toolchain above: Debian updates WebKitGTK within a stable
              # release, and 2.54 draws a page where 2.52 aborted for want of
              # an EGL display (#273). xodus-cli is already built and packaged,
              # so moving the container on cannot change its bytes; its
              # WebKitGTK ABI (webkit2gtk-4.1) is the same across the two.
              webview_snapshot="$(grep -m1 "^XODUS_WEBVIEW_SNAPSHOT = " bol/config.py | cut -d\" -f2)"
              bash scripts/pin-apt-snapshot.sh trixie "$webview_snapshot"
              apt-get update
              apt-get -y --no-install-recommends dist-upgrade
              # The same container, because the bundle has to be the closure of
              # the binary that was just built.
              scripts/build-xodus-webview.sh /tmp/xodus-webview-work \
                "/tmp/xodus-work/xodus/target/${ARCH}-unknown-linux-gnu/release/xodus-cli"
            '
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Assert the build matches the pinned SHA-256
        id: build
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          rev="$(grep -m1 '^XODUS_REV = ' bol/config.py | cut -d'"' -f2)"
          suffix="" pin_name=XODUS_ARCHIVE_SHA256
          if [ "$(uname -m)" = aarch64 ]; then
            suffix="-aarch64" pin_name=XODUS_ARM64_ARCHIVE_SHA256
          fi
          pin="$(grep -m1 "^$pin_name = " bol/config.py | cut -d'"' -f2)"
          f="dist/xodus-cli-${rev}${suffix}.tar.gz"
          src="dist/xodus-src-${rev}.tar.gz"
          if [ ! -f "$f" ]; then
            echo "::error::expected $f but it was not produced. XODUS_REV in" \
                 "bol/config.py is the pinned commit's first 12 characters," \
                 "plus -p<n> for the n patches in third_party/xodus/patches." >&2
            ls -la dist || true
            exit 1
          fi
          built="$(sha256sum "$f" | cut -d' ' -f1)"
          echo "pinned : $pin"
          echo "built  : $built"
          publishable=true
          if [ -n "$suffix" ] && [ -z "$pin" ]; then
            echo "::warning::$pin_name is empty: pin $built and run again to publish."
            publishable=false
          elif [ "$built" != "$pin" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::xodus-cli SHA-256 does not match $pin_name." \
                   "Run with publish=false, review the artifact, and pin its SHA-256 in bol/config.py." >&2
              exit 1
            fi
            echo "::warning::Unpublished candidate: pin $built as XODUS_ARCHIVE_SHA256 after review."
          fi
          echo "sha256=$built" >> "$GITHUB_OUTPUT"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          {
            echo "TARBALL=$f"
            echo "SRC_TARBALL=$src"
            echo "REV=$rev"
            echo "SUFFIX=$suffix"
            echo "PUBLISHABLE=$publishable"
            echo "ARTIFACT=xodus-cli${suffix}"
          } >> "$GITHUB_ENV"

      - name: Check the WebKitGTK runtime against its pin
        id: webview
        run: |
          rev="$(grep -m1 '^XODUS_WEBVIEW_REV = ' bol/config.py | cut -d'"' -f2)"
          pin_name=XODUS_WEBVIEW_SHA256
          [ -z "$SUFFIX" ] || pin_name=XODUS_WEBVIEW_ARM64_SHA256
          pin="$(grep -m1 "^$pin_name = " bol/config.py | cut -d'"' -f2)"
          f="dist/xodus-webview-${rev}${SUFFIX}.tar.xz"
          if [ ! -f "$f" ]; then
            echo "::error::expected $f but it was not produced." >&2
            ls -la dist || true
            exit 1
          fi
          built="$(sha256sum "$f" | cut -d' ' -f1)"
          echo "pinned : ${pin:-<unset>}"
          echo "built  : $built"
          # An unset pin is the bootstrap case: the launcher refuses to install
          # an unpinned runtime, so publishing one is how its SHA-256 becomes
          # known. Once pinned, a mismatch means the snapshot moved under us.
          if [ -n "$pin" ] && [ "$built" != "$pin" ]; then
            echo "::error::xodus-webview SHA-256 does not match $pin_name." \
                 "Re-pin bol/config.py from a reviewed build of this commit." >&2
            exit 1
          fi
          if [ -z "$pin" ]; then
            echo "::warning::$pin_name is unset; pin $built in bol/config.py."
            # The aarch64 release waits for both of its pins.
            [ -z "$SUFFIX" ] || echo "PUBLISHABLE=false" >> "$GITHUB_ENV"
          fi
          {
            echo "WEBVIEW_TARBALL=$f"
            echo "WEBVIEW_REV=$rev"
          } >> "$GITHUB_ENV"
          echo "sha256=$built" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (reuse within a run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
            ${{ env.SRC_TARBALL }}
            ${{ env.SRC_TARBALL }}.sha256
            ${{ env.WEBVIEW_TARBALL }}
            ${{ env.WEBVIEW_TARBALL }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Refuse to replace a published aarch64 release
        if: ${{ inputs.publish && env.SUFFIX != '' && env.PUBLISHABLE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="xodus-${REV}${SUFFIX}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/published"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*.sha256' -D "$RUNNER_TEMP/published"
            for sidecar in "$TARBALL.sha256" "$WEBVIEW_TARBALL.sha256"; do
              cmp "$sidecar" "$RUNNER_TEMP/published/$(basename "$sidecar")" || {
                echo "::error::$tag already holds other bytes for $(basename "$sidecar" .sha256)" >&2
                exit 1
              }
            done
          fi

      - name: Attest build provenance
        if: ${{ inputs.publish && env.PUBLISHABLE == 'true' }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ env.TARBALL }}
            ${{ env.WEBVIEW_TARBALL }}

      - name: Publish the xodus-cli release
        if: ${{ inputs.publish && env.PUBLISHABLE == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: xodus-${{ env.REV }}${{ env.SUFFIX }}
          target_commitish: ${{ github.sha }}
          name: xodus-cli ${{ env.REV }}${{ env.SUFFIX }} (from source)
          make_latest: false
          prerelease: ${{ env.SUFFIX != '' }}
          body: >
            xodus-cli built from xodus-gaming/xodus commit ${{ env.REV }} with
            --features xodus/key-chain-file. SHA-256
            ${{ steps.build.outputs.sha256 }}.
            Verify with: gh attestation verify <file> --repo ${{ github.repository }}.
            Xodus is GPL-3.0; the complete corresponding source is published as
            xodus-src-${{ env.REV }}.tar.gz in this same release.
            xodus-webview-${{ env.WEBVIEW_REV }}.tar.xz beside it is the
            WebKitGTK stack that binary links, for hosts that ship none
            (SHA-256 ${{ steps.webview.outputs.sha256 }}); it is Debian
            packages, unmodified apart from the RUNPATH that makes them
            relocatable, listed in the PACKAGES file it carries.
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
            ${{ env.SRC_TARBALL }}
            ${{ env.SRC_TARBALL }}.sha256
            ${{ env.WEBVIEW_TARBALL }}
            ${{ env.WEBVIEW_TARBALL }}.sha256
          fail_on_unmatched_files: true
