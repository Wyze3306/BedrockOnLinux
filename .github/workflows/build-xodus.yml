# Tier 1: build xodus-cli from the pinned upstream commit and publish it as an
# attested artifact the launcher downloads at runtime.
#
# Xodus (https://github.com/xodus-gaming/xodus, GPL-3.0) is how the launcher
# acquires Minecraft: it signs in to the user's own Microsoft account, obtains
# the title license and streams the MSIXVC package from the official Xbox CDN.
# See third_party/xodus/README.md for what the launcher calls and why the
# key-chain-file feature is mandatory.
#
# The compile runs in a debian:trixie container via `docker run` so the JS
# actions (checkout, attest, publish) keep Node.js on the host, matching
# build-xcurl.yml. The source tarball is published beside the binary so the
# GPL-3.0 source requirement is met by the same release.

name: Build xodus-cli

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish + attest xodus-cli as a release"
        type: boolean
        default: false
    outputs:
      artifact:
        description: "Name of the uploaded xodus-cli artifact"
        value: xodus-cli
      sha256:
        description: "SHA-256 of the built xodus-cli archive"
        value: ${{ jobs.build.outputs.sha256 }}
      webview_sha256:
        description: "SHA-256 of the built WebKitGTK runtime archive"
        value: ${{ jobs.build.outputs.webview_sha256 }}
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish + attest xodus-cli as a release on this fork"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Pinned so the artifact has a stable SHA-256 to pin in bol/config.py. Bump
  # deliberately; a toolchain change reshuffles the binary. This is the version
  # the branch was validated against locally, and the floor is real: the xodus
  # workspace declares rust-version 1.98.0 since xodus-gaming/xodus@f4ca223,
  # and cargo refuses to build it with anything older.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      rev: ${{ steps.build.outputs.rev }}
      webview_sha256: ${{ steps.webview.outputs.sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build xodus-cli in a pinned Trixie container
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e RUST_TOOLCHAIN="${RUST_TOOLCHAIN}" \
            debian:trixie@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4 \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              bash scripts/pin-apt-snapshot.sh trixie
              # Let the snapshot outrank what the image already carries. The
              # image ships packages newer than 20260701, and
              # libwebkit2gtk-4.1-dev reaches liblzma-dev, which requires
              # liblzma5 at exactly the snapshot version -- so without this the
              # install cannot be resolved at all. A priority above 1000 is the
              # only setting that makes apt pick an older version: both
              # --allow-downgrades and dist-upgrade merely permit a downgrade,
              # neither asks for one. It stays local to this workflow because
              # the snapshot script is shared with the engine builds, whose
              # archive SHA-256 is pinned against what it produces today.
              printf "Package: *\nPin: origin snapshot.debian.org\nPin-Priority: 1001\n" \
                > /etc/apt/preferences.d/99-pinned-snapshot
              apt-get update
              # protoc: the xodus crate runs prost-build.
              # cmake: libz-ng-sys builds zlib-ng with it, for the flate2
              #   backend xodus reads compressed package data through.
              # libwebkit2gtk-4.1-dev: wry/tao, linked unconditionally for the
              #   login webview.
              # libssl-dev: openssl-sys, pulled in through
              #   dbus-secret-service-keyring-store even under key-chain-file.
              # glib-networking: the GIO TLS backend. Only a Recommends of
              #   libsoup3, so --no-install-recommends leaves it out, and the
              #   webview bundle would then be unable to load an https page.
              # patchelf, xz-utils: build-xodus-webview.sh makes every bundled
              #   object find the rest of the bundle relative to itself.
              # No apostrophes anywhere in this script: it is a single quoted
              # argument to docker run, and one would end it here and hand the
              # rest to the host shell.
              apt-get install -y --no-install-recommends --allow-downgrades \
                build-essential pkg-config git ca-certificates curl \
                cmake protobuf-compiler libwebkit2gtk-4.1-dev libssl-dev \
                glib-networking patchelf xz-utils \
                tar gzip coreutils
              curl -fsSL --retry 5 https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
              . "$HOME/.cargo/env"
              scripts/build-xodus-cli.sh /tmp/xodus-work
              # The same container, because the bundle has to be the closure of
              # the binary that was just built, taken from the same snapshot.
              scripts/build-xodus-webview.sh /tmp/xodus-webview-work \
                /tmp/xodus-work/xodus/target/release/xodus-cli
            '
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Assert the build matches the pinned SHA-256
        id: build
        run: |
          rev="$(grep -m1 '^XODUS_REV = ' bol/config.py | cut -d'"' -f2)"
          pin="$(grep -m1 '^XODUS_ARCHIVE_SHA256 = ' bol/config.py | cut -d'"' -f2)"
          f="dist/xodus-cli-${rev}.tar.gz"
          src="dist/xodus-src-${rev}.tar.gz"
          if [ ! -f "$f" ]; then
            echo "::error::expected $f but it was not produced. XODUS_REV in" \
                 "bol/config.py is the pinned commit's first 12 characters," \
                 "plus -p<n> for the n patches in third_party/xodus/patches." >&2
            ls -la dist || true
            exit 1
          fi
          built="$(sha256sum "$f" | cut -d' ' -f1)"
          echo "pinned : $pin"
          echo "built  : $built"
          if [ "$built" != "$pin" ]; then
            echo "::error::xodus-cli SHA-256 does not match XODUS_ARCHIVE_SHA256." \
                 "Re-pin bol/config.py from a reviewed build of this commit." >&2
            exit 1
          fi
          echo "sha256=$built" >> "$GITHUB_OUTPUT"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          {
            echo "TARBALL=$f"
            echo "SRC_TARBALL=$src"
            echo "REV=$rev"
          } >> "$GITHUB_ENV"

      - name: Check the WebKitGTK runtime against its pin
        id: webview
        run: |
          rev="$(grep -m1 '^XODUS_WEBVIEW_REV = ' bol/config.py | cut -d'"' -f2)"
          pin="$(grep -m1 '^XODUS_WEBVIEW_SHA256 = ' bol/config.py | cut -d'"' -f2)"
          f="dist/xodus-webview-${rev}.tar.xz"
          if [ ! -f "$f" ]; then
            echo "::error::expected $f but it was not produced." >&2
            ls -la dist || true
            exit 1
          fi
          built="$(sha256sum "$f" | cut -d' ' -f1)"
          echo "pinned : ${pin:-<unset>}"
          echo "built  : $built"
          # An unset pin is the bootstrap case: the launcher refuses to install
          # an unpinned runtime, so publishing one is how its SHA-256 becomes
          # known. Once pinned, a mismatch means the snapshot moved under us.
          if [ -n "$pin" ] && [ "$built" != "$pin" ]; then
            echo "::error::xodus-webview SHA-256 does not match XODUS_WEBVIEW_SHA256." \
                 "Re-pin bol/config.py from a reviewed build of this commit." >&2
            exit 1
          fi
          if [ -z "$pin" ]; then
            echo "::warning::XODUS_WEBVIEW_SHA256 is unset; pin $built in bol/config.py."
          fi
          {
            echo "WEBVIEW_TARBALL=$f"
            echo "WEBVIEW_REV=$rev"
          } >> "$GITHUB_ENV"
          echo "sha256=$built" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (reuse within a run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xodus-cli
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
            ${{ env.SRC_TARBALL }}
            ${{ env.SRC_TARBALL }}.sha256
            ${{ env.WEBVIEW_TARBALL }}
            ${{ env.WEBVIEW_TARBALL }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Attest build provenance
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ env.TARBALL }}
            ${{ env.WEBVIEW_TARBALL }}

      - name: Publish the xodus-cli release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: xodus-${{ env.REV }}
          target_commitish: ${{ github.sha }}
          name: xodus-cli ${{ env.REV }} (from source)
          make_latest: false
          body: >
            xodus-cli built from xodus-gaming/xodus commit ${{ env.REV }} with
            --features xodus/key-chain-file. SHA-256
            ${{ steps.build.outputs.sha256 }}.
            Verify with: gh attestation verify <file> --repo ${{ github.repository }}.
            Xodus is GPL-3.0; the complete corresponding source is published as
            xodus-src-${{ env.REV }}.tar.gz in this same release.
            xodus-webview-${{ env.WEBVIEW_REV }}.tar.xz beside it is the
            WebKitGTK stack that binary links, for hosts that ship none
            (SHA-256 ${{ steps.webview.outputs.sha256 }}); it is Debian
            packages, unmodified apart from the RUNPATH that makes them
            relocatable, listed in the PACKAGES file it carries.
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
            ${{ env.SRC_TARBALL }}
            ${{ env.SRC_TARBALL }}.sha256
            ${{ env.WEBVIEW_TARBALL }}
            ${{ env.WEBVIEW_TARBALL }}.sha256
          fail_on_unmatched_files: true
